# ================================================================
# config.yaml — Windows AI Assistant v2.0
# ================================================================

# ── Modelo de IA ─────────────────────────────────────────────────
ollama_url: "http://localhost:11434"

# Modelos recomendados por qualidade em PT-BR (escolha um):
#   llama3.2:3b       — melhor custo/benefício, 3B params, rápido
#   qwen2.5:3b        — excelente em PT, instrução e código
#   gemma2:2b         — Google, muito bom em raciocínio
#   mistral:7b        — mais lento, máxima qualidade (8GB+ RAM)
model: "llama3.2:3b"

# Parâmetros de inferência otimizados para i5-13ª sem GPU
inference:
  num_ctx: 4096        # janela de contexto maior = mais memória de conversa
  num_predict: 768     # tokens por resposta
  temperature: 0.75    # 0.0=determinístico, 1.0=criativo
  repeat_penalty: 1.1  # reduz repetição nas respostas
  num_thread: 10       # i5-13600K tem 10 P-cores — use todos
  top_p: 0.9

# Cache de respostas (evita recalcular perguntas frequentes)
cache:
  enabled: true
  ttl_minutos: 60
  max_entradas: 200

# ── Personalidade ─────────────────────────────────────────────────
usuario:
  nome: "Denilson"
  estilo: "casual"     # formal | casual | técnico

# ── Voz (TTS) ────────────────────────────────────────────────────
tts:
  engine: "kokoro"     # kokoro | edge | pyttsx3 | auto
  voz: "bf_emma"       # Kokoro: af_bella, bf_emma, am_adam, bm_george
  velocidade: 1.1      # 0.5 a 2.0 (1.0 = normal)
  resumir_longas: true # resumir antes de falar respostas > 3 frases
  max_chars_falar: 400 # limite de caracteres para falar direto

# ── Microfone (STT) ───────────────────────────────────────────────
stt:
  engine: "vosk"       # vosk | whisper
  modelo_path: "models/vosk-model-pt"
  silencio_timeout: 1.5   # segundos de silêncio para parar de ouvir
  hotkey_toggle: "<ctrl>+<alt>+m"
  modo_continuo: false    # true = sempre ouvindo ao iniciar

# ── Automação ─────────────────────────────────────────────────────
automacao:
  browser_padrao: "brave"   # brave | chrome | edge | firefox
  permitir_pyautogui: true
  permitir_admin: true      # ações que requerem privilégio

# ── Segurança ─────────────────────────────────────────────────────
offline_mode: true           # bloqueia API externa
log_level: "INFO"
